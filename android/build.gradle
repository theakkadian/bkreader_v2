allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// JDK 21 (Android Studio) warns that javac -source/-target 8 is obsolete.
// Several Flutter plugins still declare Java 8; compile every Android module as 17.
subprojects { subproject ->
    def alignJava17 = {
        if (subproject.plugins.hasPlugin("com.android.library") ||
                subproject.plugins.hasPlugin("com.android.application")) {
            subproject.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
    }
    if (subproject.state.executed) {
        alignJava17()
    } else {
        subproject.afterEvaluate(alignJava17)
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
