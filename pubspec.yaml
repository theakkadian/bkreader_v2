name: bk_reader_v2
description: BET KANU Reader — QR companion for printed Syriac language books.
publish_to: 'none'
version: 2.3.1+237

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  get_it: ^8.0.2
  go_router: ^14.6.2
  http: ^1.2.2
  xml2json: ^6.2.5
  mobile_scanner: ^7.3.0
  just_audio: ^0.9.42
  video_player: ^2.9.2
  flutter_svg: ^2.0.16
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.1
  share_plus: ^10.1.3
  store_redirect: ^2.0.3
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audios/
    - assets/fonts/

  fonts:
    - family: EasternSyriac
      fonts:
        - asset: assets/fonts/EastSyriacMarcus.ttf
    - family: WesternSyriac
      fonts:
        - asset: assets/fonts/SyrCOMUrhoy.ttf
    - family: ClassicSyriac
      fonts:
        - asset: assets/fonts/EstrangeloMarcusClassic.ttf
